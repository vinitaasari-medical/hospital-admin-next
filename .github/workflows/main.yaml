name: Build and Deploy (admin-next)

on:
    push:
        branches: [main, development, test]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                node-version: 18

            - name: Install packages
              run: |-
                npm cache clean --force
                npm install --legacy-peer-deps

            # NEXT_PUBLIC_* vars are inlined at build time.
            # DEFAULT_SECRET_KEY has no NEXT_PUBLIC_ prefix — it is server-only
            # and must NOT be passed here; it is injected at Cloud Run runtime below.

            - name: Build app (dev)
              if: ${{ github.ref == 'refs/heads/development' }}
              run: npm run build
              env:
                NEXT_PUBLIC_ENVIRONMENT: dev
                PORT: 4022
                NEXT_PUBLIC_BASE_URL_ADMIN: "https://dev-apis.medicalcircles.com"
                NEXT_PUBLIC_BASE_URL_COMMON: "https://dev-apis.medicalcircles.com"
                NEXT_PUBLIC_BASE_URL_USER: "https://dev-apis.medicalcircles.com"
                NEXT_PUBLIC_BASE_URL_SETTING: "https://dev-apis.medicalcircles.com"
                NEXT_PUBLIC_BASE_URL_STAFFING: "https://dev-apis.medicalcircles.com"
                NEXT_PUBLIC_BASE_URL: "https://admin-2arwkbe4vq-ww.a.run.app"
                NEXT_PUBLIC_ENVIRONMENT_SOCKET_URL_DEV: "staffing-677473027585.me-central2.run.app"
                NEXT_PUBLIC_ENVIRONMENT_SOCKET_URL_TEST: "staffing-454641350227.me-central2.run.app"

            - name: Build app (test)
              if: ${{ github.ref == 'refs/heads/test' }}
              run: npm run build
              env:
                NEXT_PUBLIC_ENVIRONMENT: test
                PORT: 4022
                NEXT_PUBLIC_BASE_URL_ADMIN: "https://test-apis.medicalcircles.com"
                NEXT_PUBLIC_BASE_URL_COMMON: "https://test-apis.medicalcircles.com"
                NEXT_PUBLIC_BASE_URL_USER: "https://test-apis.medicalcircles.com"
                NEXT_PUBLIC_BASE_URL_SETTING: "https://test-apis.medicalcircles.com"
                NEXT_PUBLIC_BASE_URL_STAFFING: "https://test-apis.medicalcircles.com"
                NEXT_PUBLIC_BASE_URL: "https://admin-2arwkbe4vq-ww.a.run.app"
                NEXT_PUBLIC_ENVIRONMENT_SOCKET_URL_DEV: "staffing-677473027585.me-central2.run.app"
                NEXT_PUBLIC_ENVIRONMENT_SOCKET_URL_TEST: "staffing-454641350227.me-central2.run.app"

            - name: Build app (prod)
              if: ${{ github.ref == 'refs/heads/main' }}
              run: npm run build
              env:
                NEXT_PUBLIC_ENVIRONMENT: production
                PORT: 4022
                NEXT_PUBLIC_BASE_URL_ADMIN: "https://apis.medicalcircles.com"
                NEXT_PUBLIC_BASE_URL_COMMON: "https://apis.medicalcircles.com"
                NEXT_PUBLIC_BASE_URL_USER: "https://apis.medicalcircles.com"
                NEXT_PUBLIC_BASE_URL_SETTING: "https://apis.medicalcircles.com"
                NEXT_PUBLIC_BASE_URL_STAFFING: "https://apis.medicalcircles.com"
                NEXT_PUBLIC_BASE_URL: "https://admin-2arwkbe4vq-ww.a.run.app"
                # For production, NEXT_PUBLIC_ENVIRONMENT != "test", so the app
                # falls to the _DEV var for the socket host. Point it at prod.
                NEXT_PUBLIC_ENVIRONMENT_SOCKET_URL_DEV: "staffing-socket.medicalcircles.com"
                NEXT_PUBLIC_ENVIRONMENT_SOCKET_URL_TEST: "staffing-socket.medicalcircles.com"

            - name: Authenticate on GCP (dev)
              if: ${{ github.ref == 'refs/heads/development' }}
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GKE_SA_KEY_DEV }}

            - name: Authenticate on GCP (test)
              if: ${{ github.ref == 'refs/heads/test' }}
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GKE_SA_KEY_TEST }}

            - name: Authenticate on GCP (prod)
              if: ${{ github.ref == 'refs/heads/main' }}
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GKE_SA_KEY_PROD }}

            - uses: google-github-actions/setup-gcloud@v2

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker me-central2-docker.pkg.dev

            - name: Build and push Docker image
              run: |-
                PROJECT=$(gcloud config get-value project)
                IMAGE=me-central2-docker.pkg.dev/${PROJECT}/hospital-admin-next/app:${{ github.sha }}
                docker build -t ${IMAGE} .
                docker push ${IMAGE}

    deploy-development:
        if: ${{ github.ref == 'refs/heads/development' }}
        runs-on: ubuntu-latest
        needs:
            - build
        steps:
            - name: Authenticate on GCP
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GKE_SA_KEY_DEV }}

            - uses: google-github-actions/setup-gcloud@v2

            - name: Deploy to Cloud Run
              run: |-
                PROJECT=$(gcloud config get-value project)
                IMAGE=me-central2-docker.pkg.dev/${PROJECT}/hospital-admin-next/app:${{ github.sha }}
                gcloud run deploy hospital-admin-next-dev \
                  --image ${IMAGE} \
                  --region me-central2 \
                  --platform managed \
                  --allow-unauthenticated \
                  --port 4022 \
                  --set-env-vars DEFAULT_SECRET_KEY="WXB4vTr5K864xATCRkS6iTaIkthz7HZp"

    deploy-test:
        if: ${{ github.ref == 'refs/heads/test' }}
        runs-on: ubuntu-latest
        needs:
            - build
        steps:
            - name: Authenticate on GCP
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GKE_SA_KEY_TEST }}

            - uses: google-github-actions/setup-gcloud@v2

            - name: Deploy to Cloud Run
              run: |-
                PROJECT=$(gcloud config get-value project)
                IMAGE=me-central2-docker.pkg.dev/${PROJECT}/hospital-admin-next/app:${{ github.sha }}
                gcloud run deploy hospital-admin-next-test \
                  --image ${IMAGE} \
                  --region me-central2 \
                  --platform managed \
                  --allow-unauthenticated \
                  --port 4022 \
                  --set-env-vars DEFAULT_SECRET_KEY="WXB4vTr5K864xATCRkS6iTaIkthz7HZp"

    deploy-production:
        if: ${{ github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        needs:
            - build
        steps:
            - name: Authenticate on GCP
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GKE_SA_KEY_PROD }}

            - uses: google-github-actions/setup-gcloud@v2

            - name: Deploy to Cloud Run
              run: |-
                PROJECT=$(gcloud config get-value project)
                IMAGE=me-central2-docker.pkg.dev/${PROJECT}/hospital-admin-next/app:${{ github.sha }}
                gcloud run deploy hospital-admin-next-prod \
                  --image ${IMAGE} \
                  --region me-central2 \
                  --platform managed \
                  --allow-unauthenticated \
                  --port 4022 \
                  --set-env-vars DEFAULT_SECRET_KEY="${{ secrets.DEFAULT_KEY_HA }}"
